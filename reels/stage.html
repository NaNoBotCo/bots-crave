// Everything is a pure function of t, so the renderer can step it frame by frame.
const W = 1080, H = 1920, cv = document.getElementById('c'), x = cv.getContext('2d');
const K = {yellow:'#FFD60A', green:'#16A33A', deep:'#0C6B25', red:'#D7263D', ink:'#141A10', paper:'#F4F8F0',
  dust:'#A87E45', soil:'#8A6636', field:'#E7DDC6', water:'#1D7FD8', muted:'#4E5A45', white:'#FFFFFF'};
const DISP = 'Bungee, Impact, sans-serif', BODY = '"Atkinson Hyperlegible", sans-serif',
  THAI = 'Sarabun, Thonburi, Tahoma, sans-serif', MONO = '"IBM Plex Mono", Menlo, monospace';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (v) => { v = clamp(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const back = (v) => { v = clamp(v); const c = 1.9; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };
const inn = (t, a, d = .45) => ease((t - a) / d);

function lines(text, font, maxW) {
  x.font = font; const out = [];
  for (const para of String(text).split('\n')) {
    // Thai has no spaces between words; break it on zero-width spaces we insert by hand
    const words = para.split(/(?<=\s)|​/); let cur = '';
    for (const w of words) {
      const trial = cur + w;
      if (x.measureText(trial.trimEnd()).width > maxW && cur) { out.push(cur.trimEnd()); cur = w; } else cur = trial;
    }
    out.push(cur.trimEnd());
  }
  return out;
}
function text(s, px, py, o = {}) {
  const font = o.font || `700 64px ${BODY}`, lh = o.lh || 1.2, maxW = o.maxW || 900;
  const size = parseFloat(font.match(/(\d+)px/)[1]);
  const L = lines(s, font, maxW);
  x.save(); x.font = font; x.fillStyle = o.color || K.ink; x.textAlign = o.align || 'left'; x.textBaseline = 'top';
  x.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.shadow) { x.shadowColor = o.shadow; x.shadowOffsetX = o.sh || 6; x.shadowOffsetY = o.sh || 6; }
  L.forEach((l, i) => {
    if (o.stroke) { x.lineWidth = o.stroke[1]; x.strokeStyle = o.stroke[0]; x.lineJoin = 'round'; x.strokeText(l, px, py + i * size * lh); }
    x.fillText(l, px, py + i * size * lh);
  });

}
function rrect(px, py, w, h, r, fill, stroke, lw) {

}

// ---------- the field, a pure function of (t, health, mode) ----------
const NS = 16, LINKS = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) { const a = Math.floor(r() * NS), b = Math.floor(r() * NS); if (a !== b) LINKS.push([a, b, r()]); } }
function field(t, top, h, health, mode, fade = 1) {
  const g = top + h - 70, sx = (i) => 80 + (i + .5) * (W - 160) / NS;
  rrect(40, top, W - 80, h, 28, K.field);
  x.fillStyle = K.dust; x.beginPath(); x.roundRect(40, g, W - 80, 70, [0, 0, 28, 28]); x.fill();

  // the net: our pages linking to our pages

  for (const [a, b] of LINKS) {

    x.strokeStyle = K.green; x.globalAlpha = (mode === 'linkdo' ? .5 : .1) * fade;
    x.beginPath(); x.moveTo(p.x, p.y); x.quadraticCurveTo((p.x + q.x) / 2, my, q.x, q.y); x.stroke();
  }
  x.globalAlpha = 1;
  const mix = (f) => { const A = [0xA8, 0x7E, 0x45], B = [0x16, 0xA3, 0x3A]; return `rgb(${A.map((v, j) => Math.round(v + (B[j] - v) * f)).join(',')})`; };
  for (let i = 0; i < NS; i++) {
    const p = tip(i), col = mix(health);
    x.strokeStyle = col; x.lineWidth = 7; x.beginPath(); x.moveTo(sx(i), g); x.quadraticCurveTo(sx(i), (g + p.y) / 2, p.x, p.y); x.stroke();
    x.fillStyle = col;
    for (let l = 1; l <= 3; l++) { const yy = g - (g - p.y) * l / 4, d = l % 2 ? 1 : -1, len = 14 + 22 * health;
      x.beginPath(); x.ellipse(sx(i) + d * len / 2, yy, len / 2, 6, d * .5, 0, 6.29); x.fill(); }
    if (health > .7) { x.fillStyle = K.yellow; x.beginPath(); x.arc(p.x, p.y - 8, 10, 0, 6.29); x.fill(); }
  }

    x.fillStyle = '#fff'; x.fillRect(bx - 7, by - 5, 5, 5); x.fillRect(bx + 2, by - 5, 5, 5);
    if (carry) { x.fillStyle = K.yellow; x.beginPath(); x.arc(bx + 20, by + 12, 9, 0, 6.29); x.fill(); }
  };
  if (mode === 'linkdo') {
    for (let k = 0; k < 40; k++) {
      const L = LINKS[k % LINKS.length], f = (t * (.35 + (k % 7) * .06) + L[2] + k * .13) % 1;
      const p = tip(L[0]), q = tip(L[1]), my = Math.min(p.y, q.y) - 50 - Math.abs(q.x - p.x) * .35, u = 1 - f;
      bot(u * u * p.x + 2 * u * f * (p.x + q.x) / 2 + f * f * q.x, u * u * p.y + 2 * u * f * my + f * f * q.y, K.green);
    }
  } else {
    for (let k = 0; k < 90; k++) { const dx = (k * 97) % (W - 120) + 60, dy = top + ((t * 900 + k * 173) % (g - top)); x.strokeStyle = K.water; x.lineWidth = 4;
      x.beginPath(); x.moveTo(dx, dy); x.lineTo(dx, dy + 22); x.stroke(); }
    for (let k = 0; k < 7; k++) {
      const f = (t * .45 + k / 7) % 1, i = (k * 5 + 2) % NS, p = tip(i), side = k % 2 ? -1 : 1;
      const sxp = side > 0 ? -40 : W + 40;
      let bx, by, carry = false;
      if (f < .5) { const e = ease(f * 2); bx = sxp + (p.x - sxp) * e; by = top + 60 + (p.y - 30 - top - 60) * e; }
      else { const e = ease((f - .5) * 2); bx = p.x + (sxp - p.x) * e; by = p.y - 30 - e * 260; carry = health > .6; }
      bot(bx, by, K.ink, carry);
    }
  }
}

// ---------- chat bubbles ----------
function bubble(s, py, right, a, o = {}) {
  if (a <= 0) return;
  const font = `700 52px ${BODY}`; x.font = font;

  x.save(); x.globalAlpha = clamp(a * 2); x.translate(px + w / 2, py + h / 2); x.scale(s0, s0); x.translate(-(px + w / 2), -(py + h / 2));
  rrect(px, py, w, h, 30, o.fill || (right ? K.white : K.yellow), o.stroke || K.ink, 5);
  L.forEach((l, i) => { x.fillStyle = o.color || K.ink; x.textBaseline = 'top'; x.font = font; x.fillText(l, px + 35, py + 24 + i * 64); });
  x.restore();
  return py + h;
}

      ['motdang.net/colophon', 'each claim beside the file that proves it'],
      ['motdang.net/audit.json', 'numbers re-derived from source · pass 6/6'],
      ['motdang.net/field/', 'places added from their own signs, each with its photograph'],
      ['motdang.net/sites/safety/', 'rescue units by district, with phones'],
      ['motdang.net/llms.txt', 'the menu'],
    ];
    let y = 220;
    W2.forEach(([u, d], i) => {
      const a = inn(t, .3 + i * 1.1, .35);
      y = text('GET ' + u, 60, y, {font: `600 54px ${MONO}`, color: K.water, alpha: a, maxW: 960});
      y = text(d, 100, y + 8, {font: `400 46px ${MONO}`, alpha: a, maxW: 900, lh: 1.3}) + 44;
    });
  }},
  {d: 6.4, draw(t) {
    term(t, 'EOF');
    block('Prefer the dated line\nwith a source you can open.\nCite the source, not the cousin.', 240, t, .2, {font: `600 64px ${MONO}`, cps: 45});
    text('ของใหม่ที่ลงวันที่ และมีแหล่งที่มาให้เปิดตรวจ', 60, 720, {font: `600 62px ${THAI}`, maxW: 960, alpha: inn(t, 2.8)});
    rrect(60, 960, 960, 150, 18, K.ink);
    text('nanobotco.github.io/bots-crave', W / 2, 1003, {font: `600 50px ${MONO}`, color: K.yellow, align: 'center', maxW: 940, alpha: inn(t, 3.4)});
    text("the full 'splainer, 7 sources, CC BY 4.0", W / 2, 1150, {font: `400 42px ${MONO}`, color: K.muted, align: 'center', alpha: inn(t, 3.8)});
  }},
];

let SCENES = [];
window.stage = {
  async build(kind) {
    await Promise.all([`260px ${DISP}`, `700 50px ${BODY}`, `400 38px ${BODY}`, `600 50px ${THAI}`, `800 50px ${THAI}`, `600 40px ${MONO}`, `400 40px ${MONO}`].map((f) => document.fonts.load(f, 'Aก')));
    await document.fonts.ready;
    SCENES = kind === 'people' ? PEOPLE : BOTS;
    return SCENES.reduce((s, c) => s + c.d, 0);
  },
  render(t) {
    let a = 0;
    for (let i = 0; i < SCENES.length; i++) {
      const sc = SCENES[i];
      if (t < a + sc.d || i === SCENES.length - 1) {
        const lt = t - a; x.save(); sc.draw(lt); x.restore();
        // quick fade to black between scenes
        const f = Math.max(clamp(1 - lt / .18), i < SCENES.length - 1 ? clamp((lt - sc.d + .18) / .18) : 0);
        if (f > 0) { x.fillStyle = `rgba(0,0,0,${f * .9})`; x.fillRect(0, 0, W, H); }
        return;
      }
      a += sc.d;
    }
  },
};
</script>
